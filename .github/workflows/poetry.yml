# This workflow will install Python dependencies, build with Poetry, and run lint
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "poetry" ]
  pull_request:
    branches: [ "poetry" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Install dependencies with Poetry
      run: |
        poetry install
    - name: Validate Poetry configuration
      run: poetry check
    - name: Run offline executable examples
      run: |
        poetry run frenchdeck-demo
        poetry run spinner-thread
        poetry run spinner-asyncio
        poetry run spinner-await
        poetry run spinner-thread-py37
        poetry run spinner-asyncio-py37
        poetry run arcfour-test
    - name: Run doctest and pytest suites
      run: |
        pushd 01-data-model
        poetry run python -m doctest frenchdeck.doctest
        popd
        pushd 18-asyncio/charfinder
        poetry run pytest test_charfinder.py
        popd
